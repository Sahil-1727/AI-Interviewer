{% extends 'base.html' %}
{% block title %}Sign in · AI Interviewer{% endblock %}
{% block content %}
<main id="main" class="page-width">
    <section class="setup-panel">
        <h1>Sign in</h1>
        <p>Use the account provided by your administrator.</p>
        {% if login_error %}<p class="field-error" role="alert">{{ login_error }}</p>{% endif %}
        <form method="post" action="{{ url_for('access.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
            <button class="button button-primary" type="submit">Sign in</button>
        </form>
    </section>
</main>
{% endblock %}
